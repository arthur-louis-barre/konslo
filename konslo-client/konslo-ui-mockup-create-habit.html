
<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&display=swap');
  :root {
    --bg: #0d1117; --surface: #161b22; --surface-hover: #1c2330;
    --border: #21262d; --border-light: #2d3748;
    --accent: #ff6b6b; --text: #e6edf3;
    --text-secondary: #8b949e; --text-muted: #4a5568;
  }
  .page { font-family: 'Inter', sans-serif; background: var(--bg); max-width: 560px; margin: 0 auto; padding: 40px 32px 60px; min-height: 700px; }
  .page-header { display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
  .back-btn { width: 32px; height: 32px; border-radius: 8px; border: 0.5px solid var(--border-light); background: transparent; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .page-title { font-family: 'Instrument Serif', serif; font-size: 24px; font-weight: 400; color: var(--text); letter-spacing: -0.02em; }
  .form-section { margin-bottom: 28px; }
  .form-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; }
  .form-input { width: 100%; background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); outline: none; }
  .form-input::placeholder { color: var(--text-muted); }
  .form-input:focus { border-color: var(--border-light); }
  .form-textarea { width: 100%; background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 11px 14px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text); outline: none; resize: none; height: 72px; }
  .form-textarea::placeholder { color: var(--text-muted); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .period-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .period-btn { background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text-muted); transition: all 0.15s; }
  .period-btn:hover { border-color: var(--border-light); color: var(--text-secondary); }
  .period-btn.active { background: rgba(255,107,107,0.08); border-color: var(--accent); color: var(--accent); }
  .period-sub { font-size: 10px; font-weight: 400; color: inherit; opacity: 0.7; margin-top: 2px; }
  .icon-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .icon-btn { aspect-ratio: 1; background: var(--surface); border: 0.5px solid var(--border); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer; transition: all 0.15s; }
  .icon-btn:hover { border-color: var(--border-light); background: var(--surface-hover); }
  .icon-btn.active { border-color: var(--accent); background: rgba(255,107,107,0.08); }
  .reminder-row { display: flex; align-items: center; justify-content: space-between; background: var(--surface); border: 0.5px solid var(--border); border-radius: 10px; padding: 11px 14px; }
  .reminder-info { font-size: 13px; color: var(--text-secondary); }
  .reminder-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .toggle { width: 36px; height: 20px; background: var(--border); border-radius: 10px; position: relative; cursor: pointer; }
  .toggle.on { background: var(--accent); }
  .toggle-thumb { width: 14px; height: 14px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.15s; }
  .toggle.on .toggle-thumb { left: 19px; }
  .form-actions { display: flex; gap: 10px; margin-top: 36px; }
  .btn-cancel { flex: 1; padding: 11px; background: transparent; border: 0.5px solid var(--border-light); border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-muted); cursor: pointer; }
  .btn-save { flex: 2; padding: 11px; background: var(--accent); border: none; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: var(--bg); cursor: pointer; }
  .divider { height: 1px; background: var(--border); margin: 28px 0; }
</style>

<div class="page">
  <div class="page-header">
    <button class="back-btn">←</button>
    <div class="page-title">New habit</div>
  </div>

  <div class="form-section">
    <label class="form-label">Icon</label>
    <div class="icon-grid">
      <div class="icon-btn active">🧘</div>
      <div class="icon-btn">📚</div>
      <div class="icon-btn">🏃</div>
      <div class="icon-btn">💧</div>
      <div class="icon-btn">✍️</div>
      <div class="icon-btn">🎯</div>
      <div class="icon-btn">🧠</div>
      <div class="icon-btn">🌿</div>
      <div class="icon-btn">💪</div>
      <div class="icon-btn">🎸</div>
      <div class="icon-btn">🍎</div>
      <div class="icon-btn">😴</div>
      <div class="icon-btn">🚴</div>
      <div class="icon-btn">🖥️</div>
      <div class="icon-btn">☀️</div>
      <div class="icon-btn">+</div>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">Name</label>
    <input class="form-input" placeholder="e.g. Morning meditation" value="Morning meditation" />
  </div>

  <div class="form-section">
    <label class="form-label">Description <span style="color:var(--text-muted);font-size:10px;text-transform:none;letter-spacing:0">(optional)</span></label>
    <textarea class="form-textarea" placeholder="Why does this habit matter to you?"></textarea>
  </div>

  <div class="divider"></div>

  <div class="form-section">
    <label class="form-label">Goal</label>
    <div class="form-row">
      <div>
        <label class="form-label" style="font-size:9px;margin-bottom:6px">Value</label>
        <input class="form-input" placeholder="20" value="20" />
      </div>
      <div>
        <label class="form-label" style="font-size:9px;margin-bottom:6px">Unit</label>
        <input class="form-input" placeholder="minutes, sessions…" value="minutes" />
      </div>
    </div>
  </div>

  <div class="form-section">
    <label class="form-label">Frequency</label>
    <div class="period-grid">
      <div class="period-btn active">
        Daily
        <div class="period-sub">Every day</div>
      </div>
      <div class="period-btn">
        Weekly
        <div class="period-sub">Per week</div>
      </div>
      <div class="period-btn">
        Monthly
        <div class="period-sub">Per month</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="form-section">
    <label class="form-label">Reminder</label>
    <div class="reminder-row">
      <div>
        <div class="reminder-info">Daily reminder</div>
        <div class="reminder-sub">Get notified at a set time</div>
      </div>
      <div class="toggle on"><div class="toggle-thumb"></div></div>
    </div>
    <div style="margin-top:8px">
      <input class="form-input" type="time" value="08:00" style="width:auto;min-width:140px" />
    </div>
  </div>

  <div class="form-actions">
    <button class="btn-cancel">Cancel</button>
    <button class="btn-save">Save habit</button>
  </div>
</div>
