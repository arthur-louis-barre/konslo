<div class="h-card">
    <div class="h-card__body">
        <p class="h-card__name">{{ habit().name }}</p>
        <p class="h-card__detail">{{ habit().goal_value }} {{ habit().goal_unit }}</p>
    </div>
    <div class="h-card__progress">
        <span class="h-card__progress-label">{{ progressValue }} / {{ habit().goal_value }}</span>
        <div class="h-card__progress-bar">
            <div class="h-card__progress-bar-fill" [style.width.%]="progressPercent"></div>
        </div>
    </div>
    <div class="h-card__actions">
        @if (isCompleted) {
            <button class="h-card__btn h-card__btn--done" disabled>
                <span class="material-symbols-outlined">check</span>
            </button>
        } @else {
            <button class="h-card__btn" [disabled]="isLoading" (click)="addCheck()">
                <span class="material-symbols-outlined">add</span>
            </button>
        }

        <button class="h-card__btn" (click)="dropdownToggled.emit(habit().id)">
            <span class="material-symbols-outlined">more_horiz</span>
        </button>
        @if (isDropdownOpen()) {
            <div class="h-card__dropdown">
                <button class="h-card__dropdown-item" [disabled]="isLoading" (click)="resetCheck()">
                    <span class="material-symbols-outlined">replay</span>
                    <span>reset</span>
                </button>
                <button class="h-card__dropdown-item danger" [disabled]="isLoading" (click)="deleteHabit()">
                    <span class="material-symbols-outlined">delete</span>
                    <span>delete</span>
                </button>
            </div>
        }
    </div>
</div>
