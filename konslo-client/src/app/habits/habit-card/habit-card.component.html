@if (habit) {
    <div class="h-card">
        <div class="h-card__body">
            <p class="h-card__name">{{ habit.name }}</p>
            <p class="h-card__detail">{{ habit.goal_value }} {{ habit.goal_unit }}</p>
        </div>
        <div class="h-card__progress">
            <span class="h-card__progress-label">{{ habit.checks.length === 0 ? 0 : habit.checks[0].value }} / {{ habit.goal_value }}</span>
            <div class="h-card__progress-bar">
                <div class="h-card__progress-bar-fill"
                     [style.width.%]="habit.checks.length === 0 ? 0 : habit.goal_value === 0 ? 0 : Math.floor(habit.checks[0].value / habit.goal_value * 100)"></div>
            </div>
        </div>
        <div class="h-card__actions">
            @if (habit.isCompleted) {
                <button class="h-card__btn h-card__btn--done" disabled><mat-icon>check</mat-icon></button>
            } @else {
                <button class="h-card__btn" [disabled]="isLoading" (click)="checkHabit(habit)"><mat-icon>add</mat-icon></button>
            }
            <button class="h-card__btn" (click)="dropdownToggled.emit(habit.id)"><mat-icon>more_horiz</mat-icon></button>
            @if (isDropdownOpen) {
                <div class="h-card__dropdown">
                    <div class="h-card__dropdown-item" (click)="resetCheckValue(habit)">↺ Reset</div>
                    <div class="h-card__dropdown-item danger" (click)="deleteHabit(habit)">✕ Delete</div>
                </div>
            }
        </div>

    </div>
}
