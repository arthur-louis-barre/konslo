[package]
name = "konslo-core"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
async-trait = "0.1.89"
serde = { version = "1.0.228", features = ["derive"] }
