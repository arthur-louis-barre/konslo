[package]
name = "konslo-core"
version = "0.1.0"
edition = "2024"

[features]
mockable = ["dep:mockall"]
serde = ["dep:serde", "time/serde", "time/serde-well-known"]

[dependencies]
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "time", "macros"] }
serde = { version = "1.0.228", features = ["derive"], optional = true }
tokio = "1.49.0"
mockall = { version = "0.14.0", optional = true }
async-trait = "0.1.89"
time = { version = "0.3.47", features = ["serde-well-known"] }

[dev-dependencies]
mockall = "0.14.0"
tokio = { version = "1.49.0", features = ["macros", "rt"] }
