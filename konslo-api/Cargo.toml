[package]
name = "konslo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
tracing-subscriber = "0.3.22"
tokio = { version = "1.49.0", features = ["rt-multi-thread"] }
tracing = "0.1.44"
konslo-core = { version = "0.1.0", path = "../konslo-core", features = ["mockable", "serde"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "macros"] }
dotenvy = "0.15.7"
tower-http = { version = "0.6.8", features = ["cors"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["serde", "serde-well-known"] }
serde_with = { version = "3.18.0", features = ["time_0_3"] }

[dev-dependencies]
axum-test = "19.1.1"
