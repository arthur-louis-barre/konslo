services:

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=konslo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_CONFIG: debug
    environment:
      - ALLOWED_ORIGIN=http://localhost
      - DATABASE_URL=postgres://postgres:admin@postgres:5432/konslo_dev
      - JWT_SECRET=local_dev_secret
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: konslo-client
      dockerfile: Dockerfile
      args:
        BUILD_CONFIG: development
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: